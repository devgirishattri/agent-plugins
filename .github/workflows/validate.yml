name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run, so a
# superseded commit stops holding runners. Pushes to main group by commit and
# are never cancelled: every main commit gets a full run.
concurrency:
  group: validate-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# validate-release runs as parallel shards, one runner each. Every suite still
# runs on every pull request and every push to main; the shards only split the
# list. The validate-release job below passes only when every shard
# succeeded, so it remains the single check that gates a merge. The slowest
# shard (the Claude session-scheduler suite) sets the wall time.

jobs:
  native-session-metadata:
    name: native-session-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install pinned Codex CLI for transport regression
        run: |
          npm ci --ignore-scripts --prefix .github/tools/codex
          echo "$GITHUB_WORKSPACE/.github/tools/codex/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Test native metadata against an isolated daemon
        run: python3 -B scripts/test-session-metadata-live.py
      - name: Test native deletion without a daemon
        run: python3 -B scripts/test-session-deletion-live.py

  release-checks:
    name: release-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq tmux ripgrep ruby

      - name: Run release validation
        run: bash scripts/validate-release.sh

      - name: Test scheduler, context, and session-chat lock interleavings
        run: |
          python3 -B scripts/test-scheduler-locks.py
          python3 -B scripts/test-context-locks.py
          python3 -B scripts/test-session-chat-locks.py

      - name: Run cross-provider scheduler/context parity test
        run: |
          mkdir -p "$RUNNER_TEMP/provider-parity"
          env -u TMUX -u TMUX_PANE -u SESSION_CHAT_INCOMING_MODE \
            TMUX_TMPDIR="$RUNNER_TEMP/provider-parity" \
            bash scripts/test-provider-parity.sh
          bash scripts/test-session-workspace-policy-parity.sh

  smoke-claude-scheduler:
    name: smoke-claude-scheduler
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq tmux ripgrep ruby

      - name: Run Claude session-scheduler smoke tests
        run: |
          mkdir -p "$RUNNER_TEMP/claude-session-scheduler"
          env -u TMUX -u TMUX_PANE -u SESSION_CHAT_INCOMING_MODE \
            TMUX_TMPDIR="$RUNNER_TEMP/claude-session-scheduler" \
            python3 scripts/ci-smoke.py bash plugins/session-scheduler/scripts/test-session-scheduler.sh

  smoke-claude-workspace:
    name: smoke-claude-workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq tmux ripgrep ruby

      - name: Run Claude session-workspace smoke tests
        run: |
          mkdir -p "$RUNNER_TEMP/claude-session-workspace"
          env -u TMUX -u TMUX_PANE -u SESSION_CHAT_INCOMING_MODE \
            TMUX_TMPDIR="$RUNNER_TEMP/claude-session-workspace" \
            python3 scripts/ci-smoke.py bash plugins/session-workspace/scripts/test-session-workspace.sh

      - name: Run Claude harness-policy tests
        run: python3 scripts/ci-smoke.py bash plugins/session-workspace/scripts/test-harness-policy.sh

  smoke-codex-workspace:
    name: smoke-codex-workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq tmux ripgrep ruby

      - name: Run Codex session-workspace smoke tests
        run: |
          mkdir -p "$RUNNER_TEMP/codex-session-workspace"
          env -u TMUX -u TMUX_PANE -u SESSION_CHAT_INCOMING_MODE \
            TMUX_TMPDIR="$RUNNER_TEMP/codex-session-workspace" \
            python3 scripts/ci-smoke.py bash codex/plugins/session-workspace/scripts/test-session-workspace.sh

      - name: Run Codex harness-policy tests
        run: python3 scripts/ci-smoke.py bash codex/plugins/session-workspace/scripts/test-harness-policy.sh

  smoke-plugins:
    name: smoke-plugins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq tmux ripgrep ruby

      - name: Run Codex plugin smoke tests
        run: |
          python3 scripts/ci-smoke.py bash codex/plugins/session-manager/scripts/test-session-manager.sh
          python3 scripts/ci-smoke.py bash codex/plugins/knowledge/scripts/test-docs-create.sh
          python3 scripts/ci-smoke.py bash codex/plugins/knowledge/scripts/test-context.sh
          python3 scripts/ci-smoke.py bash codex/plugins/chronos/scripts/test-chronos.sh
          python3 scripts/ci-smoke.py bash codex/plugins/session-walkthrough/scripts/test-session-walkthrough.sh
          mkdir -p "$RUNNER_TEMP/codex-session-chat"
          env -u TMUX -u TMUX_PANE -u SESSION_CHAT_INCOMING_MODE \
            TMUX_TMPDIR="$RUNNER_TEMP/codex-session-chat" \
            python3 scripts/ci-smoke.py bash codex/plugins/session-chat/scripts/test-session-chat.sh
          mkdir -p "$RUNNER_TEMP/codex-session-scheduler"
          env -u TMUX -u TMUX_PANE -u SESSION_CHAT_INCOMING_MODE \
            TMUX_TMPDIR="$RUNNER_TEMP/codex-session-scheduler" \
            python3 scripts/ci-smoke.py bash codex/plugins/session-scheduler/scripts/test-session-scheduler.sh

      - name: Run Claude parity smoke tests
        run: |
          python3 scripts/ci-smoke.py bash plugins/session-manager/scripts/test-session-manager.sh
          python3 scripts/ci-smoke.py bash plugins/knowledge/scripts/test-docs-create.sh
          python3 scripts/ci-smoke.py bash plugins/chronos/scripts/test-chronos.sh
          python3 scripts/ci-smoke.py bash plugins/session-walkthrough/scripts/test-session-walkthrough.sh
          mkdir -p "$RUNNER_TEMP/claude-session-chat"
          env -u TMUX -u TMUX_PANE -u SESSION_CHAT_INCOMING_MODE \
            TMUX_TMPDIR="$RUNNER_TEMP/claude-session-chat" \
            python3 scripts/ci-smoke.py bash plugins/session-chat/scripts/test-session-chat.sh
          mkdir -p "$RUNNER_TEMP/claude-context"
          env -u TMUX -u TMUX_PANE -u SESSION_CHAT_INCOMING_MODE \
            TMUX_TMPDIR="$RUNNER_TEMP/claude-context" \
            python3 scripts/ci-smoke.py bash plugins/knowledge/scripts/test-context.sh

  knowledge-evals:
    name: knowledge-evals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq tmux ripgrep ruby

      - name: Validate unified knowledge search
        run: |
          python3 -B codex/plugins/knowledge/scripts/test-knowledge-find.py
          python3 -B plugins/knowledge/scripts/test-knowledge-find.py
          python3 -B codex/plugins/knowledge/scripts/test-recall-graph.py
          python3 -B plugins/knowledge/scripts/test-recall-graph.py

      - name: Validate retrieval evaluation tooling and corpus
        run: |
          bash codex/plugins/knowledge/scripts/test-batch-search.sh
          bash plugins/knowledge/scripts/test-batch-search.sh
          bash codex/plugins/knowledge/scripts/test-retrieval.sh
          bash plugins/knowledge/scripts/test-retrieval.sh
          python3 -B codex/plugins/knowledge/scripts/test-eval-retrieval.py
          python3 -B plugins/knowledge/scripts/test-eval-retrieval.py
          python3 -B codex/plugins/knowledge/scripts/eval-retrieval.py --repeats 1 --warmup 0 --output "$RUNNER_TEMP/retrieval-codex.json"
          python3 -B plugins/knowledge/scripts/eval-retrieval.py --repeats 1 --warmup 0 --output "$RUNNER_TEMP/retrieval-claude.json"
          python3 -B codex/plugins/knowledge/scripts/eval-retrieval.py --corpus codex/plugins/knowledge/scripts/fixtures/retrieval-eval-holdout.json --modes hook-off hook-on hook-selective --repeats 1 --warmup 0 --output "$RUNNER_TEMP/holdout-codex.json"
          python3 -B plugins/knowledge/scripts/eval-retrieval.py --corpus plugins/knowledge/scripts/fixtures/retrieval-eval-holdout.json --modes hook-off hook-on hook-selective --repeats 1 --warmup 0 --output "$RUNNER_TEMP/holdout-claude.json"
          python3 -c 'import json,sys; [print(path, json.dumps(json.load(open(path))["summary"], indent=2)) for path in sys.argv[1:]]' "$RUNNER_TEMP/retrieval-codex.json" "$RUNNER_TEMP/retrieval-claude.json"

      - name: Run structured handoff regression tests
        run: |
          python3 -B codex/plugins/knowledge/scripts/test-context-verify.py
          python3 -B plugins/knowledge/scripts/test-context-verify.py
          bash codex/plugins/knowledge/scripts/test-promotion.sh
          bash plugins/knowledge/scripts/test-promotion.sh
          bash codex/plugins/knowledge/scripts/test-doctor.sh
          bash plugins/knowledge/scripts/test-doctor.sh

  validate:
    name: validate-release
    needs:
      - release-checks
      - smoke-claude-scheduler
      - smoke-claude-workspace
      - smoke-codex-workspace
      - smoke-plugins
      - knowledge-evals
    # Run after a failed shard too, so this check reports failure instead of
    # being skipped. A cancelled run (superseded push) reports nothing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validate-release shard to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s\n' "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # Ubuntu runners ship with shellcheck preinstalled. Gate warnings and
      # errors; informational/style findings remain advisory.
      - name: Run shellcheck (warning severity)
        run: |
          shellcheck --version
          find . -path ./.git -prune -o -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck --severity=warning

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install checksum-pinned actionlint
        run: python3 -B scripts/install-workflow-tools.py --tool actionlint --dest "$RUNNER_TEMP/workflow-tools"
      - name: Test controls and check workflows
        run: python3 -B scripts/test-workflow-assurance.py --tool actionlint --bin-dir "$RUNNER_TEMP/workflow-tools"

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install checksum-pinned zizmor
        run: python3 -B scripts/install-workflow-tools.py --tool zizmor --dest "$RUNNER_TEMP/workflow-tools"
      - name: Test controls and check workflows
        run: python3 -B scripts/test-workflow-assurance.py --tool zizmor --bin-dir "$RUNNER_TEMP/workflow-tools"
